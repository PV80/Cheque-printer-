name: Test and build Windows installer

on:
  push:
    branches:
      - main
      - claude/funny-planck-t5lexx
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: End-to-end test in the real app
        run: xvfb-run -a npm run e2e

      - name: Keep screenshots if the end-to-end test fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failure-linux
          path: e2e/.tmp/shots
          if-no-files-found: ignore

  installer:
    name: Windows installer
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write # only used to attach the installer to a release when a v* tag is pushed
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build

      - name: End-to-end test on Windows
        run: npm run e2e

      - name: Package installer
        run: npx electron-builder --win nsis --x64 --publish never

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Cheque-Printer-Setup
          path: release/*.exe
          if-no-files-found: error

      - name: Keep screenshots if the end-to-end test fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failure-windows
          path: e2e/.tmp/shots
          if-no-files-found: ignore

      - name: Attach installer to the release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" release/*.exe --title "Cheque Printer $TAG" --generate-notes
